<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <h1>To-Do List</h1>

    <div id="pushupsDiv">
      <span id="pushupsCount">0</span>/100 daily pushups
      <button id="pushupsButton">+ 25 Pushups</button>
      <button id="resetPushupsButton">Reset</button>
    </div>

    <div class="input-section">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a task"
      >

      <button id="addTaskButton">
        Add Task
      </button>
    </div>

    <div id="taskContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
